<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Brand Reel</title>
<style>
@font-face{font-family:PF;font-weight:700;font-style:normal;src:url(fonts/playfair-display-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:PF;font-weight:700;font-style:normal;src:url(fonts/playfair-display-latin-700-normal.woff2) format('woff2');}
@font-face{font-family:MT;font-weight:700;font-style:normal;src:url(fonts/montserrat-cyrillic-700-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:MT;font-weight:700;font-style:normal;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2');}

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;width:720px;height:1280px;overflow:hidden}
#stage{position:relative;width:720px;height:1280px;background:#000;overflow:hidden}
#strip{position:absolute;left:0;top:438px;width:720px;height:404px;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;display:none}
.bg canvas{position:absolute;left:0;top:0;width:720px;height:404px;transform-origin:60% 50%}
#veil,#flash{position:absolute;inset:0;display:none}
#flash{background:#000}
#grain{position:absolute;inset:0;opacity:.055;mix-blend-mode:overlay;pointer-events:none}

.quote{position:absolute;left:0;right:0;display:flex;flex-direction:column}
.quote .ln{display:flex;white-space:pre}
.w{display:inline-block}
.w.off{display:none}

#outro{position:absolute;left:0;right:0;top:129px;display:none;flex-direction:column;align-items:center}
#outro .mark{width:94px;height:94px;display:block}
#outroTag{margin-top:32px;font-family:MT,sans-serif;font-weight:700;font-size:23px;letter-spacing:1.2px}

#wm{position:absolute;right:52px;top:296px;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
#wm .mark{width:34px;height:34px;display:block}
#wmTag{font-family:MT,sans-serif;font-weight:700;font-size:17px;letter-spacing:.9px}
</style>
</head>
<body>
<div id="stage">
  <div id="strip">
    <div class="bg" id="bgPaper"></div>
    <div class="bg" id="bgPhoto"></div>
    <div class="bg" id="bgSmoke"></div>
    <div class="quote" id="qA"></div>
    <div class="quote" id="qB"></div>
    <div id="veil"></div>
    <div id="outro">
      <svg class="mark" id="outroMark" viewBox="0 0 100 100" fill="none"></svg>
      <div id="outroTag"></div>
    </div>
    <canvas id="grain" width="720" height="404"></canvas>
    <div id="flash"></div>
  </div>
  <div id="wm">
    <svg class="mark" id="wmMark" viewBox="0 0 100 100" fill="none"></svg>
    <div id="wmTag"></div>
  </div>
</div>

<script src="spec.js"></script>
<script src="textures.js"></script>
<script>
(async function () {
  const qs = new URLSearchParams(location.search);
  const C  = window.COMMON;
  const S  = window.SPECS[qs.get('v') || 'v1'];
  const P  = window.PALETTES[qs.get('p') || 'p1'];
  const W = C.W, SH = C.STRIP_H, STEP = C.STEP, FPS = C.FPS;

  function glyph(el, color){
    el.setAttribute('stroke', color);
    el.innerHTML =
      '<rect x="8" y="8" width="84" height="84" rx="26" ry="26" stroke-width="8.5"/>' +
      '<circle cx="50" cy="50" r="20.5" stroke-width="8.5"/>' +
      '<circle cx="74.5" cy="25.5" r="5.6" fill="' + color + '" stroke="none"/>';
  }

  // ---------- backgrounds (built once) ----------
  const photoImg = await new Promise(res => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => res(null);          // fall back to the procedural sea
    im.src = qs.get('photo') || S.photo;   // ?photo= lets us audition a crop
  });
  document.getElementById('bgPaper').appendChild(makePaper(W, SH, P));
  const photoCanvas = photoImg ? makeSeaPhoto(W * 2, SH * 2, P, photoImg) : makeSea(W, SH, P);
  if (qs.get('thread') === '1' || S.overlay === 'thread') drawThread(photoCanvas, P);
  document.getElementById('bgPhoto').appendChild(photoCanvas);
  if (S.useSmoke) document.getElementById('bgSmoke').appendChild(makeSmoke(W, SH, P));
  const photoC = document.querySelector('#bgPhoto canvas');
  const smokeC = document.querySelector('#bgSmoke canvas');
  document.getElementById('grain').getContext('2d').drawImage(makeGrain(W, SH), 0, 0);

  // ---------- quote blocks ----------
  const words = { A: [], B: [] };
  function build(key, host){
    const cfg = S[key];
    host.style.fontFamily    = cfg.font + (cfg.font === 'PF' ? ',serif' : ',sans-serif');
    host.style.fontWeight    = cfg.weight;
    host.style.fontSize      = cfg.size + 'px';
    host.style.lineHeight    = cfg.lh + 'px';
    host.style.letterSpacing = cfg.font === 'PF' ? '.4px' : '-.2px';
    host.style.alignItems    = cfg.align;
    host.style.top           = cfg.top + 'px';
    host.style.height        = (cfg.lines.length * cfg.lh) + 'px';
    host.style.paddingLeft   = (cfg.align === 'center' ? 40 : cfg.padLeft) + 'px';
    host.style.paddingRight  = '40px';
    cfg.lines.forEach(line => {
      const ln = document.createElement('div');
      ln.className = 'ln';
      ln.style.columnGap = cfg.gap;                       // flex drops whitespace nodes
      ln.style.justifyContent = cfg.align === 'center' ? 'center' : 'flex-start';
      line.forEach(word => {
        const w = document.createElement('span');
        w.className = 'w off';
        w.textContent = word;
        ln.appendChild(w);
        words[key].push(w);
      });
      host.appendChild(ln);
    });
  }
  build('A', document.getElementById('qA'));
  build('B', document.getElementById('qB'));

  document.getElementById('wmTag').textContent    = C.handle.toUpperCase();
  document.getElementById('outroTag').textContent = C.handle.toUpperCase();

  const veil = document.getElementById('veil');
  veil.style.background = rgb(mix(P.ink, '#000000', 0.35),
                              S.outroOver === 'photo' ? 0.80 : 0.86);
  document.getElementById('wmTag').style.color      = P.goldLite;
  document.getElementById('wmTag').style.textShadow = '0 1px 4px rgba(0,0,0,.55)';
  document.getElementById('outroTag').style.color   = P.goldLite;
  glyph(document.getElementById('wmMark'), P.goldLite);

  const els = {
    paper: document.getElementById('bgPaper'),
    photo: document.getElementById('bgPhoto'),
    smoke: document.getElementById('bgSmoke'),
    flash: document.getElementById('flash'),
    qA: document.getElementById('qA'),
    qB: document.getElementById('qB'),
    outro: document.getElementById('outro'),
    outroMark: document.getElementById('outroMark')
  };
  const SHADOW = '0 2px 10px rgba(0,0,0,.50), 0 0 26px rgba(0,0,0,.28)';

  window.renderFrame = function (t) {
    const k  = Math.floor(t / STEP + 1e-9);
    const bg = S.bg(k);
    // during the outro the frame keeps showing whichever background it dims
    const shown = (bg === 'outro') ? S.outroOver : bg;
    const dark  = (shown === 'photo' || shown === 'smoke');

    els.paper.style.display = (shown === 'paper') ? 'block' : 'none';
    els.photo.style.display = (shown === 'photo') ? 'block' : 'none';
    els.smoke.style.display = (shown === 'smoke') ? 'block' : 'none';

    // slow drifts so a held background never looks frozen
    photoC.style.transform = 'scale(' + (1.05 + 0.055 * Math.min(1, t / S.DURATION)) + ')';
    if (smokeC) smokeC.style.transform =
      'scale(1.10) translateX(' + (-10 * Math.min(1, Math.max(0, (t - 3) / 3))) + 'px)';

    const inA = t >= S.A.from && t < S.A.to;
    const inB = t >= S.B.from && t < S.B.to;
    els.qA.style.display = inA ? 'flex' : 'none';
    els.qB.style.display = inB ? 'flex' : 'none';
    const col = dark ? P.goldLite : P.ink;
    for (const q of [els.qA, els.qB]) {
      q.style.color = col;
      q.style.textShadow = dark ? SHADOW : 'none';
    }

    // one word per 0.30 s beat
    for (const key of ['A', 'B']) {
      const base = S[key].start;
      words[key].forEach((w, i) => w.classList.toggle('off', t < base + i * STEP - 1e-9));
    }

    if (bg === 'outro') {
      veil.style.display = 'block';
      els.outro.style.display = 'flex';
      const s = 1 + 0.018 * Math.sin((t - S.outroFrom) * 1.5);
      els.outro.style.transform = 'scale(' + s.toFixed(4) + ')';
      const shimmer = 0.5 + 0.5 * Math.sin((t - S.outroFrom) * 1.15 - Math.PI / 2);
      glyph(els.outroMark, rgb(mix(P.gold, P.goldLite, shimmer)));
      els.outroMark.style.filter =
        'drop-shadow(0 0 ' + (10 + 10 * shimmer).toFixed(1) + 'px ' + rgb(hex(P.gold), 0.40) + ')';
      document.getElementById('outroTag').style.opacity =
        (t >= S.outroFrom + 0.2) ? '1' : '0';
    } else {
      veil.style.display = 'none';
      els.outro.style.display = 'none';
    }

    // single black frame on the cut into the outro (as in the reference)
    els.flash.style.display =
      (S.blackFlash !== null && Math.abs(t - S.blackFlash) < 0.5 / FPS) ? 'block' : 'none';
  };

  window.renderFrame(0);
  window.READY = true;
})();
</script>
</body>
</html>
